; OpenWork（chris-changes）运行配置。
; 环境变量优先于本文件，便于临时覆盖。不要在此保存 API Key、Cookie 或密码。

[server]
port = 4173
source_timeout_ms = 20000
search_cache_ttl_ms = 300000

[remote]
; 0 表示不在 OpenWork 侧额外截断；上游接口本身仍可能有限制。
remote_ok_max_results = 0
remotive_max_results = 500
jobicy_max_results = 50
himalayas_max_pages = 10
we_work_remotely_max_results = 0
nodesk_max_results = 0
arbeitnow_max_pages = 6

[anysearch]
; 推荐通过环境变量 ANYSEARCH_CLI 提供本机绝对路径，避免机器相关路径写入版本库。
cli_path =
max_results = 10

[linkedin]
; 92000000 (Worldwide) 是 LinkedIn 的 Worldwide 地理实体编号。
geo_id = 92000000
; 匿名公开搜索仅解析第一页，最大可设为 25。
max_results = 50
; LinkedIn 公开搜索页每页解析 25 张职位卡。
page_size = 25
